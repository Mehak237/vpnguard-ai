version: '3.8'

services:
  vpn-server:
    image: strongswan/strongswan:latest
    container_name: vpnguard-server
    cap_add:
      - NET_ADMIN
    networks:
      vpn-net:
        ipv4_address: 198.51.100.1
    volumes:
      - ./server/ipsec.conf:/etc/ipsec.conf:ro
      - ./server/ipsec.secrets:/etc/ipsec.secrets:ro

  vpn-client:
    image: strongswan/strongswan:latest
    container_name: vpnguard-client
    cap_add:
      - NET_ADMIN
    networks:
      vpn-net:
        ipv4_address: 198.51.100.10
    volumes:
      - ./client/ipsec.conf:/etc/ipsec.conf:ro
      - ./client/ipsec.secrets:/etc/ipsec.secrets:ro
    depends_on:
      - vpn-server

networks:
  vpn-net:
    driver: bridge
    ipam:
      config:
        - subnet: 198.51.100.0/24
